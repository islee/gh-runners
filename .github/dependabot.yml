version: 2
# Keeps the SHA-pinned GitHub Actions and the rescuer's base image current. Dependabot understands
# SHA-pinned actions with a `# vX.Y.Z` comment and bumps both the SHA and the comment.
#
# NOTE: Dependabot has NO pre-commit ecosystem — it does not update .pre-commit-config.yaml hook
# revs. Refresh those with `pre-commit autoupdate` (periodically, or via pre-commit.ci).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # NOTE: images/light/Dockerfile is digest-pinned on purpose (rebuilt and loaded by an operator, see
  # images/build-light.sh), so only the rescuer image is tracked here.
  - package-ecosystem: docker
    directory: /rescuer
    schedule:
      interval: weekly
