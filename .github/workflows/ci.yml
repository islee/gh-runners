name: ci

# Single source of truth: run the same pre-commit hooks CI and locally.
# Hooks: shellcheck + hadolint + ruff (lint), rescuer pytest + slots bats (test),
# detect-private-key + gitleaks (secret scan), plus YAML/whitespace hygiene. pytest and bats are
# installed pinned before the gate runs. See .pre-commit-config.yaml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # gitleaks scans history on PRs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pre-commit + dev deps
        run: pip install pre-commit -r requirements-dev.txt
      - name: Install bats (pinned, matches local dev dep)
        # WHY a user prefix: the hosted image's global npm prefix (/usr/local) stopped being writable by the
        # runner user (EACCES on /usr/local/share/man/man7, 2026-10); a user prefix needs no sudo.
        run: |
          npm install -g --prefix "$HOME/.npm-global" bats@1.13.0
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
      - name: Run gate (lint + tests + secret scan)
        run: pre-commit run --all-files --show-diff-on-failure
