# Pre-commit lint + test + secret gate. Install once:  pre-commit install
# Run on demand:  pre-commit run --all-files
# Dev deps once:  pip install -r requirements-dev.txt
# Bats (bats-core 1.13): brew install bats-core (macOS) | npm install -g bats@1.13.0
# CI runs the same hooks (.github/workflows/ci.yml), so local == CI.
#
# Hooks summary:
#   shellcheck        — shell script lint (warning+)
#   hadolint          — Dockerfile lint
#   ruff / ruff-format — rescuer Python lint + format
#   rescuer-pytest    — rescuer/ stranded-run logic + JWT (offline, fake GitHub client)
#   slots-bats        — slots/ controller behavioral tests (JWT, label guard, launch, heartbeat; needs bats-core)
#   trailing-whitespace / end-of-file-fixer / check-yaml / check-merge-conflict — hygiene
#   detect-private-key / gitleaks — secret scan

repos:
  # ── Hygiene + secret safety ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key        # blocks committing a .pem / .key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks                  # broad secret scan (tokens, high-entropy strings)

  # ── Lint ─────────────────────────────────────────────────────────────────
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [--severity=warning, --exclude=SC1091]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--config, .hadolint.yaml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff                      # rescuer lint
        files: ^rescuer/.*\.py$
      - id: ruff-format               # rescuer format
        files: ^rescuer/.*\.py$

  # ── Test ─────────────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: rescuer-pytest
        name: rescuer pytest
        entry: python3 -m pytest -q rescuer/tests
        language: system             # needs: pip install -r requirements-dev.txt + openssl
        files: ^rescuer/
        pass_filenames: false
      - id: slots-bats
        name: slots behavioral tests (bats)
        entry: bash slots/tests/run-bats.sh
        language: system             # needs: bats-core + openssl + python3 (stdlib)
        files: ^(slots|images)/
        pass_filenames: false
